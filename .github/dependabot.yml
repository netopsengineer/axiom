version: 2

updates:
  # GitHub Actions referenced in workflows. Actions are SHA-pinned with a
  # `# vX.Y.Z` comment; Dependabot bumps both the SHA and the comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      # github-actions is not SemVer-aware for cooldown; only default-days is
      # supported here (semver-*-days is npm-style ecosystems only).
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      # ci:/chore: are non-releasing commit types, so dependency bumps never
      # trigger a semantic-release version bump.
      prefix: "ci"
    labels: ["dependencies", "github-actions"]
    ignore:
      # The official validate-plugins action publishes no tags, so Dependabot
      # can't track it. .github/workflows/bump-validate-action.yml re-pins it.
      - dependency-name: "anthropics/claude-plugins-community*"

  # Repository tooling (release, validation, lint, and exact host CLI tools).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    versioning-strategy: "increase"
    groups:
      repository-tooling:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
    labels: ["dependencies", "npm"]
    ignore:
      # v10 render-function presets are incompatible with the current
      # release-notes-generator writer v8 and silently emit empty notes.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]

  # Third-party pre-commit hooks in .pre-commit-config.yaml.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      # pre-commit is not SemVer-aware for cooldown; only default-days is
      # supported here (semver-*-days is npm-style ecosystems only).
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
    labels: ["dependencies", "pre-commit"]
