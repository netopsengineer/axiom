name: Auto-merge Dependabot

# Dependabot-triggered workflows cannot access Actions secrets, and merges made
# with GITHUB_TOKEN do not trigger push workflows. This trusted scheduled run
# mints the existing repository GitHub App token and processes same-repository
# Dependabot PRs oldest-first. At most one stale branch is refreshed per run,
# then the queue waits for its required checks and protected auto-merge before
# advancing. App-attributed updates and merges trigger normal CI and releases.

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ^24.22.1
          check-latest: true

      - name: Mint GitHub App token
        id: app-token
        env:
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          TOKEN_PERMISSIONS: '{"contents":"write","pull_requests":"write"}'
        run: node .github/scripts/create-app-token.mjs

      - name: Advance protected Dependabot queue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/scripts/run-dependabot-queue.mjs
