name: Dependency audit

# The required Repository checks job runs this all-severity gate on every PR.
# This daily and push-triggered workflow also detects advisories disclosed after
# a merge and keeps the default branch's dependency signal current.
#
# It also runs on push to main whenever the dependency graph or audit tooling
# changes, so a landed audit fix is re-verified immediately.

on:
  schedule:
    - cron: "37 6 * * *" # daily 06:37 UTC
  push:
    branches: [main]
    paths:
      - package-lock.json
      - package.json
      - .github/scripts/check-npm-audit.mjs
      - .github/workflows/dependency-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --loglevel=error
      - run: npm run audit:ci
