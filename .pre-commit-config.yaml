# Local checks for the axiom marketplace — mirrors validate.yml's local/static
# jobs and adds automation script tests for workflow helpers.
# Runs with prek (https://prek.j178.dev), a drop-in for pre-commit:
#
#   prek install           # install the git pre-commit hook (one time)
#   prek run --all-files   # run every hook against the whole repo
#
# Maintenance: npm-backed local hooks are single-sourced in package.json, while
# third-party pre-commit hooks are SHA-frozen with a `# frozen: vX.Y.Z`
# comment, so Dependabot tracks matching release tags instead of default-branch
# HEAD. Bump them with `prek auto-update --freeze`.
repos:
  - repo: local
    hooks:
      # Mirrors the "JavaScript lint" job. Reuses the Biome version pinned in
      # package.json (one source of truth, Dependabot-tracked); auto-fixes via
      # `biome check --write`. If it rewrites a file, the commit stops so you
      # can re-stage.
      - id: biome
        name: biome (check + write)
        entry: npm run lint:fix
        language: system
        files: \.(js|mjs)$
        pass_filenames: false

      # Canonical metadata owns every vendor marketplace artifact. Generated
      # changes stop the commit for restaging.
      - id: marketplace-generate
        name: marketplace generation
        entry: npm run marketplaces:build
        language: system
        files: ^(\.axiom/|\.agents/plugins/marketplace\.json|\.claude-plugin/marketplace\.json|plugins/|\.github/scripts/(build-marketplaces|prepare-plugin-release|lib/marketplace-contract)\.mjs)
        pass_filenames: false

      # Mirrors the "Plugin manifests" job's core local validation. Requires
      # npm ci so the exact repository Claude Code CLI is installed.
      - id: claude-plugin-validate
        name: claude plugin validate (strict)
        entry: npm run check:plugins:local
        language: system
        files: ^(\.axiom/|\.claude-plugin/marketplace\.json|plugins/|package\.json|package-lock\.json)
        pass_filenames: false

      - id: claude-marketplace-smoke
        name: claude marketplace isolated smoke
        entry: npm run check:claude:smoke
        language: system
        files: ^(\.axiom/|\.agents/plugins/marketplace\.json|\.claude-plugin/marketplace\.json|plugins/[^/]+/(\.claude-plugin/plugin\.json|\.codex-plugin/plugin\.json|skills/)|\.github/scripts/(smoke-claude-marketplace|lib/claude-package-contract|lib/marketplace-smoke-fixture|lib/marketplace-contract)\.mjs|package\.json|package-lock\.json)
        pass_filenames: false

      - id: codex-marketplace-static
        name: codex marketplace static validation
        entry: npm run check:codex:static
        language: system
        files: ^(\.axiom/|\.agents/plugins/marketplace\.json|\.claude-plugin/marketplace\.json|plugins/|\.github/scripts/(check-codex-marketplace|lib/marketplace-contract)\.mjs)
        pass_filenames: false

      - id: codex-marketplace-smoke
        name: codex marketplace isolated smoke
        entry: npm run check:codex:smoke
        language: system
        files: ^(\.axiom/|\.agents/plugins/marketplace\.json|\.claude-plugin/marketplace\.json|plugins/[^/]+/(\.claude-plugin/plugin\.json|\.codex-plugin/plugin\.json|skills/)|\.github/scripts/(smoke-codex-marketplace|lib/marketplace-smoke-fixture|lib/marketplace-contract)\.mjs|package\.json|package-lock\.json)
        pass_filenames: false

      # Keeps local edits honest against repository-specific marketplace and
      # shipped-plugin invariants that are too contextual for generic linters.
      - id: repo-invariants
        name: repository invariants
        entry: npm run check:repo
        language: system
        files: ^(\.axiom/|\.agents/plugins/marketplace\.json|\.claude-plugin/marketplace\.json|plugins/|\.github/scripts/(check-repo-invariants|lib/marketplace-contract)\.mjs|\.github/workflows/.*\.ya?ml)
        pass_filenames: false

      - id: marketplace-script-tests
        name: marketplace script tests
        entry: npm run test:marketplaces
        language: system
        files: ^(\.axiom/|\.agents/plugins/marketplace\.json|\.claude-plugin/marketplace\.json|plugins/|\.github/scripts/.*marketplace.*\.mjs|\.github/scripts/(check-repo-invariants|prepare-plugin-release).*\.mjs|package\.json|package-lock\.json)
        pass_filenames: false

      - id: automation-script-tests
        name: automation script tests
        entry: npm run test:automation
        language: system
        files: ^(\.github/scripts/.*\.mjs|\.github/npm-audit-allowlist\.json|\.github/workflows/(dependency-audit.*|release-note-compatibility)\.yml|package\.json|package-lock\.json)
        pass_filenames: false

      - id: validate-plugins-smoke-tests
        name: validate-plugins smoke tests
        entry: npm run test:validate-plugins
        language: system
        files: ^(\.github/actions/validate-plugins/|\.github/scripts/(check-validate-plugins-smoke|lib/claude-package-contract)\.mjs|\.github/workflows/validate\.yml|package\.json|package-lock\.json)
        pass_filenames: false

      # Keeps all generated README regions derived from canonical structured
      # sources. If a plugin is added or renamed, the hook updates README.md and
      # stops the commit so the generated blocks can be staged with the content
      # change.
      - id: readme-generated-blocks
        name: README generated blocks
        entry: npm run docs:readme
        language: system
        files: ^(\.axiom/|plugins/.*/README\.md|plugins/.*/skills/.*/evals/evals\.json|README\.md|\.github/scripts/sync-readme-.*\.mjs)
        pass_filenames: false

      - id: yaml-syntax
        name: YAML syntax
        entry: npm run lint:yaml --
        language: system
        files: \.ya?ml$

      - id: spelling
        name: spelling
        entry: npm run lint:spelling
        language: system
        files: \.(md|mjs|js|json|ya?ml)$
        pass_filenames: false

      - id: markdown-links
        name: Markdown links
        entry: npm run lint:links --
        language: system
        files: \.md$

  # Mirrors the "Markdown lint" job, using the repo's .markdownlint-cli2.jsonc.
  # markdownlint-cli2 is not an npm dependency here (CI uses the action), so the
  # hook is pinned to the SHA for v0.23.2, the latest tag (this project ships
  # NO GitHub releases; tags are the only source).
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b # frozen: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

  # Secret scanning, both for local commits and full-repo CI coverage.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # GitHub Actions static analysis.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  # Shell script linting for workflow scripts and future automation.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: ^\.github/actions/validate-plugins/upstream/

  # Hardening checks for GitHub Actions workflows.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa # frozen: v1.29.0
    hooks:
      - id: zizmor
